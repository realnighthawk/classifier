image:
  repository: ghcr.io/realnighthawk/classifier
  tag: latest
  pullPolicy: Always # tag is mutable (latest); pin a sha-<short> tag and use IfNotPresent in prod

replicas: 1
service:
  name: classifier-svc
  port: 8000

# ~3 GB resident (ModernBERT-large, fp32); ~0.3 s/query on CPU, one request at a time per pod.
resources:
  requests: {cpu: "1", memory: 3Gi}
  limits: {cpu: "2", memory: 4Gi}
